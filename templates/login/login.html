{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Royal Road Scraper</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/login/login.css' %}">
</head>
<body>
    <div class="app-container">
        <div class="card auth-card">
            <div class="card-header">
                <h1 class="logo-text">Royal Road <span>Scraper</span></h1>
                <p class="subtitle">Welcome back! Please login to your account.</p>
            </div>
            
            {% if messages %}
                <div class="messages-container">
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            {% if error %}
                <div class="alert alert-error">
                    {{ error }}
                </div>
            {% endif %}

            <form action="{% url 'login:login' %}" method="POST" class="auth-form">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <input type="text" id="username" name="username" value="{{ request.POST.username|default:'' }}" placeholder="Enter your username or email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>
            
            <div class="card-footer">
                <p>Don't have an account? <a href="{% url 'register:register' %}">Create an account</a></p>
            </div>
        </div>
    </div>
    <script src="{% static 'js/login/login.js' %}"></script>
</body>
</html>
