name: Django checks

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rrscraper
          POSTGRES_PASSWORD: rrscraper
          POSTGRES_DB: rrscraper
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check migrations and test SQLite
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py test
      - name: Test PostgreSQL
        env:
          DATABASE_URL: postgresql://rrscraper:rrscraper@localhost:5432/rrscraper
          DATABASE_SSL_REQUIRE: '0'
        run: python manage.py test
      - name: Check production settings
        env:
          DJANGO_ENV: production
          DJANGO_ALLOWED_HOSTS: rrscraper.example.test
          DJANGO_HSTS_INCLUDE_SUBDOMAINS: '1'
          DJANGO_HSTS_PRELOAD: '1'
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())')"
          python manage.py check --deploy --fail-level WARNING
