{% extends 'scraper/base.html' %}

{% block title %}Login - Royal Road Scraper{% endblock %}

{% block content %}
<div class="card auth-card">
    <div class="card-header">
        <h1 class="logo-text">Royal Road <span>Scraper</span></h1>
        <p class="subtitle">Welcome back! Please login to your account.</p>
    </div>
    
    <form action="{% url 'home' %}" method="get" class="auth-form">
        <!-- Using GET method here just to redirect to home on submit for the demo -->
        <div class="form-group">
            <label for="username">Username or Email</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
    
    <div class="card-footer">
        <p>Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
    </div>
</div>
{% endblock %}
