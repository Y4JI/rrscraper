{% extends 'scraper/base.html' %}

{% block title %}Register - Royal Road Scraper{% endblock %}

{% block content %}
<div class="card auth-card">
    <div class="card-header">
        <h1 class="logo-text">Royal Road <span>Scraper</span></h1>
        <p class="subtitle">Create a new account to get started.</p>
    </div>
    
    <form action="{% url 'login' %}" method="get" class="auth-form">
        <!-- Using GET method here just to redirect to login on submit for the demo -->
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Choose a username" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Create a password" required>
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block">Register</button>
    </form>
    
    <div class="card-footer">
        <p>Already have an account? <a href="{% url 'login' %}">Back to Login</a></p>
    </div>
</div>
{% endblock %}
